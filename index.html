<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <!-- スマホで見たときに画面の大きさをぴったり自動調整する設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>地域活性化WebARプロジェクト - 地域AR動物園</title>

    <!-- 0円でWebAR（空間固定・カメラ表示）を実現する軽量ライブラリ -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
      /* 画面上に簡単な案内を表示するデザイン */
      #info-ui {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 14px;
        z-index: 999;
        pointer-events: none;
        text-align: center;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- 画面上の案内テキスト -->
    <div id="info-ui">📱 スマホを持って周りを見回したり、歩いてみよう！</div>

    <!-- AR空間のメインエリア -->
    <a-scene embedded vr-mode-ui="enabled: false">
      
      <!-- 【1. 素材（アセット）の読み込み】フォルダにあるファイルを事前に読み込みます -->
      <a-assets>
        <img id="poster-img" src="poster.jpg">
        <a-asset-item id="cow-model" src="Cow.glb"></a-asset-item>
        <a-asset-item id="horse-model" src="Horse.glb"></a-asset-item>
        <a-asset-item id="llama-model" src="Llama.glb"></a-asset-item>
        <a-asset-item id="pig-model" src="Pig.glb"></a-asset-item>
        <a-asset-item id="pug-model" src="Pug.glb"></a-asset-item>
        <a-asset-item id="sheep-model" src="Sheep.glb"></a-asset-item>
        <a-asset-item id="zebra-model" src="Zebra.glb"></a-asset-item>
      </a-assets>

      <!-- 【2. 視点（カメラ）とセンサーの設定】 -->
      <!-- スマホの向き（ジャイロセンサー）と動きに合わせて視点が移動します -->
      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>

      <!-- 【3. 3Dオブジェクトとポスターの配置】 -->
      <!-- position="横(X) 高さ(Y) 奥行き(Z)"（単位はメートルです） -->
      <!-- rotation="X軸回転 Y軸回転 Z軸回転"（向きを調整できます） -->

      <!-- 🖼️ 正面3メートル前：地域ポスター看板 -->
      <a-plane src="#poster-img" position="0 1.6 -3" width="2.0" height="2.8" rotation="0 0 0"></a-plane>

      <!-- 🐮 右手前（3m右、3m奥）：ウシ -->
      <a-entity gltf-model="#cow-model" position="3 0 -3" scale="0.8 0.8 0.8" rotation="0 -45 0"></a-entity>

      <!-- 🐴 左手前（3m左、3m奥）：ウマ -->
      <a-entity gltf-model="#horse-model" position="-3 0 -3" scale="0.8 0.8 0.8" rotation="0 45 0"></a-entity>

      <!-- 🐷 右（4m右）：ブタ -->
      <a-entity gltf-model="#pig-model" position="4 0 0" scale="0.6 0.6 0.6" rotation="0 -90 0"></a-entity>

      <!-- 🐑 左（4m左）：ヒツジ -->
      <a-entity gltf-model="#sheep-model" position="-4 0 0" scale="0.6 0.6 0.6" rotation="0 90 0"></a-entity>

      <!-- 🦓 右後ろ（3m右、4m後ろ）：シマウマ -->
      <a-entity gltf-model="#zebra-model" position="3 0 4" scale="0.8 0.8 0.8" rotation="0 -135 0"></a-entity>

      <!-- 🐶 左後ろ（3m左、4m後ろ）：パグ -->
      <a-entity gltf-model="#pug-model" position="-3 0 4" scale="0.5 0.5 0.5" rotation="0 135 0"></a-entity>

      <!-- 🦙 正面奥（8メートル奥）：歩いて見に行く目玉スポットのラマ！ -->
      <a-entity gltf-model="#llama-model" position="0 0 -8" scale="1.0 1.0 1.0" rotation="0 0 0"></a-entity>

      <!-- 背景をカメラ映像にするため無効化 -->
      <a-sky visible="false"></a-sky>
    </a-scene>

  </body>
</html>
