<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>地域活性化WebARプロジェクト</title>
    <!-- 安定動作する公式ライブラリの読み込み -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: transparent;
      }
      /* 背景のカメラ映像を最背面に固定する設定 */
      #ar-webcam {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
      }
      .a-canvas {
        background-color: transparent !important;
      }
      /* 全画面ボタンのデザイン */
      #fullscreen-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        padding: 12px 20px;
        background-color: #2196F3;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <!-- 背景に表示するカメラ映像 -->
    <video id="ar-webcam" autoplay playsinline muted></video>

    <!-- 全画面化ボタン -->
    <button id="fullscreen-btn" onclick="toggleFullScreen()">全画面表示にする</button>

    <!-- AR空間の作成 -->
    <a-scene embedded vr-mode-ui="enabled: false">
      
      <!-- 事前に読み込む画像素材の設定 -->
      <a-assets>
        <img id="town-poster" src="poster.jpg" crossorigin="anonymous">
      </a-assets>

      <!-- 現実空間に浮遊固定されるオブジェクト群（カメラから奥に1.5mの位置） -->
      <a-entity position="0 0 -1.5">
        
        <!-- ① 地域ポスター画像（color="#FFFFFF"で元の発色を維持 / width・heightで横長に調整） -->
        <a-plane position="-0.5 0 0" width="1.2" height="0.6" color="#FFFFFF" src="#town-poster">
        </a-plane>

        <!-- ② 観光シンボル用の回転する3D立方体 -->
        <a-box position="0.5 0 0" scale="0.25 0.25 0.25" color="#FF9800"
               animation="property: rotation; to: 0 405 0; loop: true; dur: 5000">
        </a-box>

      </a-entity>

      <!-- カメラ設定（デバイスの傾き・向きセンサーと連動） -->
      <a-entity camera look-controls></a-entity>
    </a-scene>

    <script>
      // Webカメラの映像を取得して背景に流し込む処理
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" } // スマホの場合は背面カメラを優先起動
          });
          const videoElement = document.getElementById('ar-webcam');
          videoElement.srcObject = stream;
        } catch (err) {
          console.error("カメラの起動に失敗しました:", err);
        }
      }

      // ページ読み込み時にカメラを起動
      window.addEventListener('load', startCamera);

      // 全画面切り替えの処理
      function toggleFullScreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            alert(`全画面表示にできませんでした: ${err.message}`);
          });
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      }
    </script>
  </body>
</html>
