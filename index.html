<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebARテスト</title>
    <!-- WebAR用ライブラリ -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene embedded vr-mode-ui="enabled: false">
      <!-- 素材の読み込み（まずはポスターとウシだけでテスト） -->
      <a-assets>
        <img id="poster-img" src="poster.jpg">
        <a-asset-item id="cow-model" src="Cow.glb"></a-asset-item>
      </a-assets>

      <!-- カメラ設定 -->
      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>

      <!-- 正面にポスター -->
      <a-plane src="#poster-img" position="0 1.6 -3" width="1.5" height="2.0"></a-plane>

      <!-- 右側にウシ -->
      <a-entity gltf-model="#cow-model" position="2 0 -3" scale="0.5 0.5 0.5"></a-entity>

    </a-scene>

  </body>
</html>
